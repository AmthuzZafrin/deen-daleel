# Deen & Daleel — full question bank
#
# Fields
#   slug          stable public id — do not change once published
#   question      the canonical phrasing; also the primary match phrasing
#   paraphrases   other real ways people ask it. These matter more than they
#                 look: a user's wording is matched against these, so a clumsy
#                 phrasing someone would actually type belongs here.
#   tier          A = the corpus addresses this directly
#                 B = principle only; state it, cite it, then refer
#                 C = nothing citable; decline and explain what it turns on
#                 Untagged means A. Verified against retrieval, not guessed:
#                 34 tags were changed after running every question through
#                 the corpus. See content/tier-audit.md for the log and the
#                 method, and content/tier-audit.tsv for the raw run.
#   expect        'answer' (default) or 'decline'
#   also_retrieve extra queries run at drafting time, so a contested question
#                 is not drafted from whichever side happened to share
#                 vocabulary with how it was asked. See scripts/draft.ts.
#   note          guidance for the reviewer, never shown to readers.
#
# Coverage is weighted toward what reverts and ordinary Muslims actually ask.
# The query log shows what is missing; add entries here rather than guessing.

# ─────────────────────────────────────────────────────────────
