[project]
name = "deen-daleel-ingest"
version = "0.1.0"
description = "Corpus ingestion for Deen & Daleel: parse, normalise, chunk, embed, load."
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "psycopg[binary]>=3.1",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ingest", "ingest.pipelines"]
package-dir = { "ingest" = "." }

[tool.pytest.ini_options]
testpaths = ["tests"]
